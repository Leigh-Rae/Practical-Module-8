<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <h1>Conference Venue Map</h1>

    <svg width="700" height="500" viewBox="0 0 700 500">
      <rect
        x="50"
        y="60"
        width="600"
        height="300"
        fill="lightgray"
        stroke="black"
        stroke-width="2"
      />
      <rect
        x="200"
        y="280"
        width="250"
        height="80"
        fill="lightblue"
        stroke="black"
        stroke-width="2"
      />
      <rect
        x="200"
        y="60"
        width="250"
        height="80"
        fill="lightblue"
        stroke="black"
        stroke-width="2"
      />
      <rect
        x="50"
        y="150"
        width="50"
        height="120"
        fill="lightpink"
        stroke="black"
        stroke-width="2"
      />

        cx="320"
        cy="210"
        r="60"
        fill="lightgreen"
        stroke="black"
        stroke-width="2"
      ></circle>

      <text x="250" y="320" font-size="20">Main Stage</text>
      <text x="250" y="100" font-size="20">Registration Area</text>
      <text x="50" y="200" font-size="12">Food Area</text>
      <text x="290" y="210" font-size="12">Workshop Area</text>
